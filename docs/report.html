<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https:; base-uri 'none'; form-action 'none'">
<title>SweepSafe scanner</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top"><div class="wrap">
<a class="brand" href="./">SweepSafe</a>
<nav><a href="https://github.com/Ops119/SweepSafe">GitHub</a></nav>
</div></header>
<main class="wrap">
<h1 class="small">Approval scanner</h1>
<p><span class="mode" id="mode">Read-only until you click Revoke</span></p>
<form class="scan" id="form" autocomplete="off">
<label class="hidden" for="chain">Chain</label>
<select id="chain"><option value="ethereum">Ethereum</option><option value="base">Base</option><option value="arbitrum">Arbitrum</option><option value="optimism">Optimism</option><option value="polygon">Polygon</option><option value="bnb">BNB Chain</option><option value="avalanche">Avalanche</option><option value="linea">Linea</option><option value="robinhood">Robinhood Chain</option><option value="solana">Solana</option></select>
<label class="hidden" for="address">Wallet address</label>
<input id="address" placeholder="Wallet address (0x… or Solana)" spellcheck="false" required>
<button class="primary" id="go" type="submit">Scan</button>
</form>
<div class="row"><button type="button" id="connect">Connect wallet</button><button type="button" id="share" class="hidden">Copy share link</button></div>
<p class="status" id="status" role="status" aria-live="polite"></p>
<progress id="bar" class="hidden" max="100" value="0"></progress>
<div id="warnings"></div>
<div id="results"></div>
<footer>No backend, no keys, no tracking. Data comes from public RPCs and open lists, straight from your browser.</footer>
</main>
<script src="sweepsafe.js"></script>
<script src="app.js"></script>
</body>
</html>
