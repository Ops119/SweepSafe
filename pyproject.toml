[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sweepsafe"
version = "0.1.0"
description = "Find and revoke risky ERC-20 token approvals. Free, open source, non-custodial."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["ethereum", "evm", "approvals", "security", "wallet", "web3"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
    "Intended Audience :: End Users/Desktop",
]
dependencies = ["pydantic>=2.5,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
sweepsafe = "sweepsafe.cli:main"

[project.urls]
Homepage = "https://github.com/Ops119/SweepSafe"
Issues = "https://github.com/Ops119/SweepSafe/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sweepsafe = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
source = ["sweepsafe"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
